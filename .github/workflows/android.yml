name: Godot verification and Android APK
on:
  push:
    branches: ["codex/sky-castle-step29"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-castle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare editable project
        run: python3 tools/prepare_project.py
      - name: Install Godot and display support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri fonts-noto-cjk
          mkdir -p work
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o work/godot.zip
          unzip -q work/godot.zip -d work
          mv "work/Godot_v${GODOT_VERSION}-stable_linux.x86_64" work/godot
          chmod +x work/godot
          echo "$GITHUB_WORKSPACE/work" >> "$GITHUB_PATH"
      - name: Import project
        run: godot --headless --editor --path game --import
      - name: Run regression suite
        run: python3 tools/run_tests.py
      - name: Capture actual gameplay and character gallery
        run: xvfb-run -a godot --path game --rendering-method gl_compatibility --script res://tests/capture_preview.gd
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-castle-verification
          path: |
            work/reports/
            game/previews/
          if-no-files-found: warn
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare project and export dependencies
        run: |
          python3 tools/prepare_project.py
          mkdir -p work build
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o work/godot.zip
          unzip -q work/godot.zip -d work
          mv "work/Godot_v${GODOT_VERSION}-stable_linux.x86_64" work/godot
          chmod +x work/godot
          echo "$GITHUB_WORKSPACE/work" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o work/templates.tpz
          unzip -q work/templates.tpz -d work/export
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp work/export/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          keytool -genkeypair -keystore work/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          python3 tools/configure_android.py
      - name: Import and build installable APK
        run: |
          godot --headless --editor --path game --import
          godot --headless --path game --export-debug Android ../build/MeongRandy-Step29-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/MeongRandy-Step29-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/MeongRandy-Step29-debug.apk > build/apk-info.txt
          sha256sum build/MeongRandy-Step29-debug.apk > build/SHA256SUMS.txt
      - name: Package source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile("build/MeongRandy-Step29-source.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in Path("game").rglob("*"):
                  if f.is_file() and ".godot" not in f.parts and "previews" not in f.parts:
                      z.write(f, Path("MeongRandy-Step29") / f.relative_to("game"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MeongRandy-Step29-Android-and-source
          path: build/
