name: Publish verified Android download
on:
  push:
    branches: ["codex/sky-castle-step29"]
    paths: [".github/workflows/publish-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: jck35511/drd
      VERIFIED_RUN: "42366345367"
      VERIFIED_SHA: "098265b975fcaa58e3332f34c42707510f645429"
    steps:
      - name: Verify completed Android tests and download original artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > run.json
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json,os
          run=json.load(open("run.json"))
          assert run["status"]=="completed" and run["conclusion"]=="success"
          assert run["head_sha"]==os.environ["VERIFIED_SHA"]
          jobs={j["name"]:j for j in json.load(open("jobs.json"))["jobs"]}
          for name in ["verify","android","android-smoke"]:
              assert jobs[name]["conclusion"]=="success"
          PY
          gh run download "$VERIFIED_RUN" -R "$GH_REPO" -n MeongRandy-Step29-Android-and-source --dir build
          gh run download "$VERIFIED_RUN" -R "$GH_REPO" -n Android-emulator-verification --dir screenshots
          sha256sum -c build/SHA256SUMS.txt
          python3 - <<'PY'
          import pathlib,struct
          for name in ["00-start-screen.png","13-defeat-original.png","14-victory-original.png"]:
              data=pathlib.Path("screenshots",name).read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II",data[16:24])==(720,1280)
          PY
      - name: Publish verified APK and actual Android screenshots
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/compare/$VERIFIED_SHA...$GITHUB_SHA" > changes.json
          python3 - <<'PY'
          import json
          files=json.load(open("changes.json"))["files"]
          assert len(files)<300
          for item in files:
              assert item["filename"].startswith(("docs/",".github/")),item["filename"]
          PY
          cat > notes.md <<'EOF'
          ## 멍랜디 0.31.1
          Assets에서 MeongRandy-0.31.1-debug.apk를 다운로드해 설치하세요. 압축 해제가 필요 없습니다.

          - Godot 기본 로고를 제목과 강아지 그림만 있는 멍랜디 로딩 화면으로 교체했습니다. 추가 대기시간 없이 실제 시작창으로 전환합니다.
          - 소환 보관함의 배치 버튼 옆에 판매를 추가했습니다. 한 번 누르면 1마리만 판매합니다.
          - 기존 판매 가격 유지: 소형견 10G, 중형견 40G, 대형견 100G. 맹수·신화·초월·히든은 판매 불가입니다.
          - 0.31.0의 원본 시작·결과창, 보관함 회수, 필드/보관함 재료 조합, 도감과 천장 변경을 포함합니다.

          기능 검사 46개와 Android 에뮬레이터 검증을 통과했습니다. 실제 앱 시작 영상을 녹화해 사용자 로딩 화면을 확인했으며, 보관함 판매 후 수량·골드·저장 상태를 실제 터치로 검증했습니다. 실기기 성능은 별도 확인이 필요합니다.
          EOF
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json,pathlib
          releases=[r for r in json.load(open("releases.json")) if r["tag_name"]=="v0.31.1"]
          assert len(releases)<=1
          if releases:
              assert releases[0]["draft"],"Refusing to overwrite a published release"
          pathlib.Path("exists.txt").write_text("yes" if releases else "no")
          PY
          if [ "$(cat exists.txt)" = no ]; then
            gh release create v0.31.1 build/MeongRandy-0.31.1-debug.apk build/MeongRandy-Step29-source.zip build/SHA256SUMS.txt screenshots/00-start-screen.png screenshots/13-defeat-original.png screenshots/14-victory-original.png screenshots/00-loading-screen.png screenshots/startup.mp4 -R "$GH_REPO" --target "$GITHUB_SHA" --title "멍랜디 0.31.1 Android" --notes-file notes.md --draft --prerelease
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json,pathlib,hashlib
          matches=[r for r in json.load(open("releases.json")) if r["tag_name"]=="v0.31.1"]
          assert len(matches)==1
          release=matches[0]
          assert release["draft"]
          assets={a["name"]:a for a in release["assets"]}
          paths=["build/MeongRandy-0.31.1-debug.apk","build/MeongRandy-Step29-source.zip","build/SHA256SUMS.txt","screenshots/00-start-screen.png","screenshots/13-defeat-original.png","screenshots/14-victory-original.png","screenshots/00-loading-screen.png","screenshots/startup.mp4"]
          for filename in paths:
              path=pathlib.Path(filename)
              data=path.read_bytes()
              asset=assets[path.name]
              assert asset["state"]=="uploaded" and asset["size"]==len(data)
              assert asset["digest"]=="sha256:"+hashlib.sha256(data).hexdigest()
          pathlib.Path("release-id.txt").write_text(str(release["id"]))
          PY
          release_id=$(cat release-id.txt)
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f target_commitish="$GITHUB_SHA" -F draft=false -F prerelease=true --jq '{url: .html_url, draft: .draft, assets: [.assets[] | {name, browser_download_url}]}'
